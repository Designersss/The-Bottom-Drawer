name: Core gameplay CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Tests/BottomDrawer.Core.Tests.csproj
      - name: Compile with warnings as errors and run assertions
        run: dotnet run --project Tests/BottomDrawer.Core.Tests.csproj --configuration Release --no-restore
